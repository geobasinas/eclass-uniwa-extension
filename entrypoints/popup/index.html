<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIWA eClass Helper</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="title-group">
          <h1>UNIWA eClass</h1>
          <span class="meta">eclass.uniwa.gr</span>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="theme-btn"
          aria-label="Toggle theme"
          title="Toggle dark / light mode"
        >
          <span id="theme-icon" class="theme-icon" aria-hidden="true"></span>
        </button>
      </header>

      <section class="section">
        <label class="toggle-row">
          <span class="toggle-label">Auto-login on eClass</span>
          <input id="auto-login" class="switch" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Keep session alive (10 min)</span>
          <input id="keep-alive" class="switch" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Quick course links &amp; ZIP</span>
          <input id="quick-links" class="switch" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Dark mode on eClass</span>
          <input id="dark-mode" class="switch" type="checkbox" />
        </label>
      </section>

      <form id="creds-form" class="section">
        <label class="field">
          <span>Username</span>
          <input id="username" type="text" autocomplete="username" placeholder="e.g. idpe..." />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </label>
        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="clear-btn" class="secondary">Clear</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
